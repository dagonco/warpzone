[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warpzone"
description = "One game library on a home server, delivered to every console, with saves that follow you."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["syncthing", "emulation", "steam-deck", "emudeck", "retro-gaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
warpzone = "warpzone.cli:main"

[tool.setuptools]
# The data folders hold TOML only; listing them keeps setuptools from warning about them.
packages = ["warpzone", "warpzone.data", "warpzone.data.profiles"]

[tool.setuptools.dynamic]
version = { attr = "warpzone.__version__" }

[tool.setuptools.package-data]
"warpzone.data" = ["*.toml"]
"warpzone.data.profiles" = ["*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
