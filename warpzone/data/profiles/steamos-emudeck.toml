]

# PPSSPP (Flatpak). The file starts with a UTF-8 BOM, which the ini handler keeps.
[settings.ppsspp]
process = ["PPSSPPSDL", "PPSSPPQt"]
[settings.ppsspp.files.ini]
path = "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SYSTEM/ppsspp.ini"
format = "ini"
noise = [
  '[General]FirstRun',
  '[General]RunCount',
  '[General]CurrentDirectory',
  '[General]*ScrollPosition',
  '[Recent]*',
  '[PlayTime]*',
  '[Debugger]*',
  '[Log]*',
