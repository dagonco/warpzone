name = "steamos-emudeck"
description = "SteamOS with EmuDeck (Steam Deck, Steam Machine)"

[paths]
library = "~/Emulation"
songs = "~/Songs"
tools = "~/.local/share/warpzone/tools"
media = "~/Emulation/tools/downloaded_media"
esde = "~/ES-DE"
settings = "~/.local/share/warpzone/settings"
play_state = "~/.local/share/warpzone/play-state"

# Between ES-DE starts a timer publishes what ES-DE saved, so favourites and play statistics
# reach the other devices without waiting for the next start. A device that lists
# `play-state` merges into the gamelists at ES-DE's startup, before ES-DE reads them.
[play_state]
refresh = "15min"

# Paths in the library folder that the device never receives from the hub, whatever
# its whitelist says. These lines go ahead of the whitelist. The folders that the
# `[bios.*]` entries below deliver are added automatically.
[library]
ignore = [
  # Cemu keeps its installs and saves here; it is per-device data. The saves are
  # synced on their own (saves.cemu-saves).
  "/roms/wiiu/mlc01",
  # EmuDeck replaces these folders with symlinks to the emulator's real directories
  # and Syncthing never follows symlinks, so the hub's real folders would clash
  # with them. (eden/keys, eden/firmware, azahar/keys and cemu are `[bios.*]`.)
  "/bios/ryujinx/keys",
  "/bios/flycast/bios",
  "/bios/shadps4/sys_modules",
  "/bios/citron/keys",
  "/bios/citron/firmware",
  "/bios/yuzu/keys",
  "/bios/yuzu/firmware",
  "/bios/suyu/keys",
  "/bios/suyu/firmware",
  # RetroArch's Flycast core keeps the shared VMUs and the console flash here, in the
  # system folder. They are per-device data and not on the hub, so a receive-only
  # device would list them as local changes and a revert would erase them. No `(?d)`:
  # a hub-side delete of bios/dc must not take them along. With the core option
  # "Per-Game VMUs" on, the VMUs go to RetroArch's saves folder, which does sync.
  "/bios/dc/vmu_save_*.bin",
  "/bios/dc/dc_nvmem.bin",
  # The same core also writes its Vulkan pipeline cache and a data folder there.
  "/bios/dc/vulkan_pipeline.cache",
  "/bios/dc/data",
  # Files and folders EmuDeck writes into the library on every console. They are not
  # on the hub, so a receive-only device would list them as local changes (and a
  # revert would delete them). `(?d)` lets Syncthing remove a ROM folder that the hub
  # deleted even though one of these files is still inside it.
  "/bios/PPSSPP",
  "(?d)/bios/**/readme.txt",
  # EmuDeck's own folders in bios/: emulator-owned data that the hub never fills.
  # (bios/mame and bios/neocd are not here: a hub may deliver BIOS files into them.)
  "(?d)/bios/HdPacks",
  "(?d)/bios/Mupen64plus",
  "(?d)/bios/fbneo",
  "(?d)/bios/kronos",
  "(?d)/bios/same_cdi",
  "(?d)/bios/ryujinx",
  "(?d)/bios/shadps4",
  "(?d)/bios/yuzu",
  # RetroArch's mame2003-plus core writes its high score list and an artwork folder
  # into its system folder (a hub may still deliver samples next to them).
  "(?d)/bios/mame2003-plus/hiscore.dat",
  "(?d)/bios/mame2003-plus/artwork",
  "(?d)/roms/*/systeminfo.txt",
  "(?d)/roms/*/metadata.txt",
]

# One entry per save folder. `path` is the REAL directory: EmuDeck exposes
# saves through symlinks under ~/Emulation/saves and Syncthing never follows
# symlinks, so pointing Syncthing at the symlink would sync nothing.
[saves.retroarch-saves]
path = "~/.var/app/org.libretro.RetroArch/config/retroarch/saves"
[saves.retroarch-states]
path = "~/.var/app/org.libretro.RetroArch/config/retroarch/states"
[saves.dolphin-gc]
path = "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC"
[saves.dolphin-wii]
path = "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/Wii"
[saves.dolphin-states]
path = "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/StateSaves"
[saves.duckstation-saves]
path = "~/Emulation/saves/duckstation/saves"
[saves.duckstation-states]
path = "~/Emulation/saves/duckstation/states"
[saves.pcsx2-saves]
path = "~/Emulation/saves/pcsx2/saves"
[saves.pcsx2-states]
path = "~/Emulation/saves/pcsx2/states"
[saves.melonds-saves]
path = "~/Emulation/saves/melonds/saves"
[saves.melonds-states]
path = "~/Emulation/saves/melonds/states"
[saves.eden-saves]
path = "~/Emulation/storage/eden/nand/user/save"
# Switch user profiles: a save belongs to a profile ID, so the same profiles must
# exist on every console for the saves to show up.
[saves.eden-profiles]
path = "~/Emulation/storage/eden/nand/system/save/8000000000000010"
[saves.ryujinx-user]
path = "~/.config/Ryujinx/bis/user"
ignore = ["!/save", "!/saveMeta", "*"]
[saves.ryujinx-profiles]
path = "~/.config/Ryujinx/bis/system/save"
[saves.azahar-saves]
path = "~/Emulation/storage/azahar/sdmc"
[saves.azahar-states]
path = "~/.local/share/azahar-emu/states"
[saves.shadps4-saves]
path = "~/.local/share/shadPS4/savedata"
[saves.cemu-saves]
path = "~/Emulation/roms/wiiu/mlc01/usr/save"
[saves.xenia-content]
path = "~/Emulation/roms/xbox360/content"
# EmuDeck installs the Proton build of Xenia or the native one, not both. The two
# keep separate hub folders, so consoles that run different builds do not share.
[saves.xenia-native]
path = "~/.local/share/Xenia/content"
[saves.ppsspp-saves]
path = "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SAVEDATA"
[saves.ppsspp-states]
path = "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/PPSSPP_STATE"
[saves.rpcs3-saves]
path = "~/Emulation/storage/rpcs3/dev_hdd0/home/00000001/savedata"
[saves.rpcs3-trophy]
path = "~/Emulation/storage/rpcs3/dev_hdd0/home/00000001/trophy"
[saves.vita3k-saves]
path = "~/Emulation/storage/Vita3K/ux0/user/00/savedata"
[saves.mame-saves]
path = "~/Emulation/saves/mame/saves"
[saves.mame-states]
path = "~/Emulation/saves/mame/states"
[saves.rmg-saves]
path = "~/Emulation/saves/RMG/saves"
[saves.rmg-states]
path = "~/Emulation/saves/RMG/states"
[saves.scummvm-saves]
path = "~/Emulation/saves/scummvm/saves"
[saves.primehack-gc]
path = "~/.var/app/io.github.shiiion.primehack/data/dolphin-emu/GC"
[saves.primehack-wii]
path = "~/.var/app/io.github.shiiion.primehack/data/dolphin-emu/Wii"
[saves.primehack-states]
path = "~/.var/app/io.github.shiiion.primehack/data/dolphin-emu/StateSaves"

# Flycast keeps its VMU memory cards (vmu_save_A1.bin, or <game>_vmu_save_A1.bin
# per game) and the console flash (dc_nvmem.bin; <game>.nvmem for arcade boards) in
# the same folder as the standalone BIOS (dc_boot.bin, dc_flash.bin). Only the saves
# are listed: the BIOS is not synced from here.
[saves.flycast-saves]
path = "~/.var/app/org.flycast.Flycast/data/flycast"
ignore = ["!/*vmu_save_*.bin", "!/*nvmem*", "*"]

# YARG is not part of EmuDeck. This is the Linux build's data folder (it writes
# `custom/` in lowercase). The song cache and the list of bad songs hold absolute
# paths of one machine, so they never sync, and neither do the *.bak copies YARG
# leaves next to the profiles. scores/ holds a SQLite database: close the game on
# one console before playing on another.
[saves.yarg-data]
path = "~/.config/unity3d/YARC/YARG/release"
ignore = [
  "(?d)/profiles/*.bak",
  "!/settings.json",
  "!/scores",
  "!/profiles",
  "!/playlists",
  "!/custom",
  "*",
]

# BIOS placements. The library cannot deliver these files: EmuDeck turns these
# folders into symlinks under ~/Emulation/bios and Syncthing never follows symlinks.
# Each entry is a receive-only folder from `hub` (a folder under the hub's library/)
# into the emulator's REAL directory, and only the files its `ignore` lets through
# arrive. The library ignores the hub folder on both sides. A device opts in with
# the `bios` group. `create_when`: create the target when this folder exists (the
# emulator is installed); otherwise a missing target is skipped.
[bios.eden-keys]
hub = "bios/eden/keys"
path = "~/.local/share/eden/keys"
ignore = ["!/prod.keys", "!/title.keys", "*"]
create_when = "~/.local/share/eden"
[bios.eden-firmware]
hub = "bios/eden/firmware"
# EmuDeck points its bios/eden/firmware symlink at ~/.local/share/eden/nand/..., but
# sets Eden's nand_directory to the folder below; this is the more likely one.
path = "~/Emulation/storage/eden/nand/system/Contents/registered"
create_when = "~/Emulation/storage/eden/nand"
verify = true  # verify on a real device
[bios.azahar-keys]
hub = "bios/azahar"
path = "~/.local/share/azahar-emu/sysdata"
ignore = ["!/aes_keys.txt", "*"]
create_when = "~/.local/share/azahar-emu"
[bios.cemu-keys]
hub = "bios/cemu"
# Cemu reads keys.txt only from its user data folder (KeyCache.cpp), and writes a template
# there on its first start when none is found. EmuDeck writes ~/.config/Cemu, not this
# folder, so the folder is created once that one exists and the keys arrive before Cemu
# first runs. The keys are needed for encrypted disc images (WUD/WUX), not for .wua archives.
path = "~/.local/share/Cemu"
ignore = ["!/keys.txt", "*"]
create_when = "~/.config/Cemu"

# shadPS4 has no package installer: it runs the extracted games it finds in its install
# directories. `warpzone inbox` extracts PS4 packages into library/roms/ps4/games, so
# `provision device` adds that folder to the list, keeping the entries already there.
# v0.21 and later keep the list in config.json (General.install_dirs); older versions in
# config.toml (GUI.installDirs). Each file is edited only if it exists, and only while
# shadPS4, its Qt launcher and the emulator they start are closed. The list is a nested
# value that the settings layer below cannot write, and it follows each console's own
# library path, so it is declared here and not layered.
[shadps4]
config = ["~/.local/share/shadPS4/config.json", "~/.local/share/shadPS4/config.toml"]
process = ["shadps4", "shadPS4QtLauncher", "Shadps4-qt.AppImage", "Shadps4-sdl.AppImage"]
install_dirs = ["{library}/roms/ps4/games"]
# shadPS4 reads DLC from one folder, `<addon_dir>/<TITLE_ID>/<entry>/`, which `warpzone inbox`
# fills in library/roms/ps4/dlc. Unlike the install directories this value is replaced, not
# extended (`General.addon_install_dir` in config.json, `GUI.addonInstallDir` in config.toml).
addon_dir = "{library}/roms/ps4/dlc"

# Cemu keeps its installs and saves below `mlc_path` in settings.xml, and lists the games of
# `GamePaths`. EmuDeck sets both with an xmlstarlet that does not start on SteamOS 3.9, which
# leaves `mlc_path` empty (Cemu then uses `default_mlc`, a folder warpzone does not sync) and
# `GamePaths` on a missing SD card. `provision device` sets `mlc_path` to the folder whose
# `usr/save` is `saves.cemu-saves` and adds the library's Wii U folder to `GamePaths`, keeping
# the rest of the file. It edits only an existing file, only while Cemu is closed, and keeps
# `mlc_path` as it is while the folder Cemu uses now holds game saves. Like the shadPS4 list,
# the values follow each console's library path, so they are declared here and not layered.
[cemu]
settings = "~/.config/Cemu/settings.xml"
process = ["Cemu", "Cemu.AppImage"]
mlc = "{library}/roms/wiiu/mlc01"
default_mlc = "~/.local/share/Cemu/mlc01"
game_path = "{library}/roms/wiiu/roms"

# EmuDeck's shadps4.sh starts `Shadps4-qt.AppImage -d -g <eboot>`, and that Qt launcher can
# crash with those arguments while the emulator itself runs the same game fine. EmuDeck
# rewrites its script, so it is not edited. `provision device` writes `script` instead (it
# reads the version selected in the Qt launcher and runs its SDL emulator directly) and
# points the `emulator` entry of ES-DE's find rules at it. EmuDeck can put its own entry back,
# which `doctor` reports. The script lives outside ~/ES-DE, which only syncs gamelists and
# collections.
[shadps4.launch]
qt_ini = "~/.local/share/shadPS4QtLauncher/qt_ui.ini"
versions = "~/.local/share/shadPS4QtLauncher/versions.json"
script = "~/.local/share/warpzone/shadps4-launch.sh"
find_rules = "~/ES-DE/custom_systems/es_find_rules.xml"
emulator = "SHADPS4"

# Vita3K runs the games it finds in `ux0/app/<TITLEID>` of its own storage, while the library
# delivers each one to `roms/psvita/app/<TITLEID>`. `provision device`, `warpzone links sync`
# and ES-DE's startup script (so a game that was just whitelisted needs no manual step) keep
# one symlink per title in `target` pointing at the library folder. Only links are changed:
# a real folder is never touched, and only a dangling link into `source` is removed. Nothing
# happens while Vita3K runs. A title is a folder named like a Vita title id that already holds
# `eboot.bin` and `sce_sys/param.sfo` (a game that is still syncing is linked once it is
# complete). Vita3K rebuilds its app list when the folders under `ux0/app` change.
[links.vita3k]
source = "{library}/roms/psvita/app"
target = "~/Emulation/storage/Vita3K/ux0/app"
process = ["Vita3K"]
match = 'PCS[A-I]\d{5}'
require = ["eboot.bin", "sce_sys/param.sfo"]

# A game whose `eboot.bin` is still encrypted starts only with its licence, `ux0/license/<TITLEID>/
# <CONTENT_ID>.rif` (Vita3K logs "No klic provided for encrypted App" without it). `inbox` files
# it in `roms/psvita/license/<TITLEID>/`, and this links the folder like the games. Vita3K makes
# `ux0/license` only when it installs a licence, so the link rule makes it when `ux0` is there.
[links.vita3k-license]
source = "{library}/roms/psvita/license"
target = "~/Emulation/storage/Vita3K/ux0/license"
process = ["Vita3K"]
match = 'PCS[A-I]\d{5}'
noun = "license"
create_target = true

# Emulator settings: the files whose keys `warpzone settings` layers across devices.
# A key is common unless it is listed under `device`. Patterns match the canonical key
# (see development/design/emulator-settings.md, "Format handlers"): `*` is any run of characters, `?` one, and
# `[` is literal. Lists are written in TOML literal strings so a Qt `\` needs no escape.
#   noise   never proposed by `capture` (window state, recent files, input and paths).
#   secret  logins and tokens: never captured, applied, snapshotted or logged.
#   device  pre-selected for the device layer (resolution, docked mode, device name).
#   known   proposed by `capture --seed` as settings meant to be shared.
# `verify = true`: a process name or path not yet confirmed on a device.
#
# Files that hold only a login (Dolphin's RetroAchievements.ini, PPSSPP's achievements
# token) are deliberately not declared.

# Eden (Switch). Qt settings: a stored value is ignored while its `key\default`
# companion says true; the qt-ini handler writes the companion when it writes a key.
[settings.eden]
process = ["eden", "Eden.AppImage"]
[settings.eden.files.qt-config]
path = "~/.config/eden/qt-config.ini"
format = "qt-ini"
noise = [
  '[Controls]*',
  '[Data%20Storage]*',
  '[Debugging]*',
  '[DisabledAddOns]*',
  '[Multiplayer]*',
  '[Miscellaneous]*',
  '[Audio]*_device',
  '[Renderer]vulkan_device',
  '[Services]network_interface',
  '[System]rng_seed*',
  '[System]custom_rtc*',
  '[UI]UILayout\*',
  '[UI]UIGameList\*',
  '[UI]Paths\gamedirs*',
  '[UI]Paths\recentFiles',
  '[UI]Paths\romsPath',
  '[UI]Paths\symbolsPath',
  '[UI]Paths\external_content_dirs*',
  '[UI]Shortcuts\*',
  '[UI]Screenshots\*',
  '[UI]Multiplayer\*',
  '[UI]firstStart',
  '[UI]calloutFlags',
  '[UI]fullscreen',
  '[UI]show*Bar',
  '[UI]showConsole',
  '[Renderer]renderdoc_hotkey',
  '[WebService]web_api_url',
]
secret = ['[WebService]*_token', '[WebService]*_username']
device = [
  '[System]device_name',
  '[System]use_docked_mode',
  '[Renderer]resolution_setup',
  '[Renderer]max_anisotropy',
  '[Renderer]scaling_filter',
  '[Renderer]anti_aliasing',
  '[Renderer]fsr_sharpening_slider',
  '[Renderer]fullscreen_mode',
]
known = [
  '[System]language_index',
  '[System]region_index',
  '[System]time_zone_index',
  '[UI]Paths\language',
  '[Renderer]backend',
  '[Renderer]gpu_accuracy',
  '[Renderer]use_asynchronous_shaders',
]

# RetroArch (Flatpak). `cfg` is retroarch.cfg; `opt` is one file per core, with the core's
# name in the path and in the file id: `opt:Flycast`, `opt:Mupen64Plus-Next`. The core
# options are named by each core, so the lists below are patterns over the common spellings.
# `create = true`: a core that was never opened has no .opt file, but its layered options
# must still be there when it first starts.
[settings.retroarch]
process = ["retroarch"]
[settings.retroarch.files.cfg]
path = "~/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg"
format = "retroarch-cfg"
noise = [
  '*_directory',
  '*_path',
  '*_dir',
  'input_*',
  'joypad_*',
  'video_window_*',
  'video_fullscreen_x',
  'video_fullscreen_y',
  'video_monitor_index',
  'current_resolution_id',
  'audio_device',
  'camera_device',
  'midi_*',
  'libretro_*',
  'log_*',
  'cloud_sync_*',
  'discord_*',
  'test_input_file_*',
  'bundle_assets_*',
  'ai_service_url',
  'video_driver',
  'video_context_driver',
  'video_windowed_position_*',
  'video_fullscreen',
  'video_windowed_fullscreen',
  'video_stream_*',
  'video_record_*',
  'custom_viewport_*',
  'crt_*',
  'audio_driver',
  'microphone_device',
  'vulkan_gpu_index',
  'screen_brightness',
  'screen_orientation',
  'app_icon',
  'netplay_ip_*',
  'netplay_*mitm_server',
  'cheevos_custom_host',
]
secret = [
  'cheevos_username',
  'cheevos_password',
  'cheevos_token',
  'netplay_password',
  'netplay_spectate_password',
  'webdav_*',
  'kiosk_mode_password',
  'content_show_settings_password',
  '*_stream_key',
]
device = [
  'run_ahead_*',
  'preemptive_frames_enable',
  'video_refresh_rate',
  'video_scale',
]
known = [
  'user_language',
  'netplay_nickname',
  'cheevos_enable',
  'cheevos_hardcore_mode_enable',
  'savestate_auto_save',
  'savestate_auto_load',
  'rewind_enable',
]
[settings.retroarch.files.opt]
path = "~/.var/app/org.libretro.RetroArch/config/retroarch/config/{name}/{name}.opt"
format = "retroarch-cfg"
create = true
# No core option file was in the inventory the lists were checked against, so these are
# the cores' own spellings from their documentation; Flycast's `reicast_*` is the one the
# trial settled on (per-game VMUs keep each game's memory card in the saves folder).
device = ['*internal_resolution*', '*resolution*', '*upscal*']
known = ['reicast_region', 'reicast_language', 'reicast_per_content_vmus']

# DuckStation.
[settings.duckstation]
process = ["duckstation-qt", "DuckStation.AppImage"]
[settings.duckstation.files.settings]
path = "~/.local/share/duckstation/settings.ini"
format = "ini"
noise = [
  '[UI]*',
  '[Folders]*',
  '[GameList]*',
  '[Logging]*',
  '[Pad*]*',
  '[Hotkeys]*',
  '[InputSources]*',
  '[ControllerPorts]*',
  '[Debug]*',
  '[BIOS]SearchDirectory',
  '[MemoryCards]Directory',
  '[Main]SettingsVersion',
  '[GPU]Adapter',
  '[Audio]OutputDevice',
  '[Audio]Driver',
  '[Cheevos]AvatarURL',
  '[Cheevos]LoginTimestamp',
]
secret = ['[Cheevos]Username', '[Cheevos]Token']
device = ['[GPU]ResolutionScale', '[GPU]Multisamples', '[Main]RunaheadFrameCount']
known = [
  '[Main]Language',
  '[Console]Region',
  '[GPU]PGXPEnable',
  '[GPU]TextureFilter',
  '[Cheevos]Enabled',
  '[Cheevos]ChallengeMode',
]

# PCSX2. Some keys appear twice in a section (`[Folders]SaveStates`); the ini handler
# reports a duplicated key as not writable, and the whole `[Folders]` section is noise.
[settings.pcsx2]
process = ["pcsx2-qt", "pcsx2-Qt.AppImage"]
[settings.pcsx2.files.ini]
path = "~/.config/PCSX2/inis/PCSX2.ini"
format = "ini"
noise = [
  '[Folders]*',
  '[Pad*]*',
  '[Hotkeys]*',
  '[InputSources]*',
  '[USB*]*',
  '[GameList]*',
  '[GameListTableView]*',
  '[Logging]*',
  '[Debugger/*]*',
  '[EmuCore/TraceLog]*',
  '[EmuCore/Profiler]*',
  '[DEV9/*]*',
  '[UI]*Geometry',
  '[UI]*State',
  '[UI]SettingsVersion',
  '[Achievements]LoginTimestamp',
  '[Filenames]BIOS',
  '[EmuCore/GS]Adapter',
  '[EmuCore/GS]*Directory',
  '[EmuCore/GS]OsdFontPath',
  '[EmuCore]BlockDumpSaveDirectory',
  '[EmuCore]ManuallySetRealTimeClock',
  '[EmuCore]Rtc*',
  '[SPU2/Output]DriverName',
  '[SPU2/Output]DeviceName',
  '[UI]SetupWizardIncomplete',
]
secret = ['[Achievements]Username', '[Achievements]Token']
device = ['[EmuCore/GS]upscale_multiplier', '[EmuCore/GS]MaxAnisotropy']
known = [
  '[UI]Language',
  '[EmuCore]EnableWideScreenPatches',
  '[EmuCore/GS]Renderer',
  '[Achievements]Enabled',
  '[Achievements]ChallengeMode',
]

# Dolphin (Flatpak). The GameCube language is `[Core]SelectedLanguage`, the interface
# language `[Interface]LanguageCode`. The achievements login lives in a file of its own
# that is not declared.
[settings.dolphin]
process = ["dolphin-emu"]
[settings.dolphin.files.dolphin]
path = "~/.var/app/org.DolphinEmu.dolphin-emu/config/dolphin-emu/Dolphin.ini"
format = "ini"
noise = [
  '[Analytics]*',
  '[General]ISOPath*',
  '[General]RecursiveISOPaths',
  '[BluetoothPassthrough]*',
  '[Core]SIDevice*',
  '[Core]Wiimote*',
  '[Input]*',
  '[SDL_Hints]*',
  '[Display]*',
  '[NetPlay]*',
]
known = [
  '[Interface]LanguageCode',
  '[Core]SelectedLanguage',
  '[Core]FallbackRegion',
  '[Core]OverrideRegionSettings',
  '[Core]GFXBackend',
]
[settings.dolphin.files.gfx]
path = "~/.var/app/org.DolphinEmu.dolphin-emu/config/dolphin-emu/GFX.ini"
format = "ini"
device = [
  '[Settings]InternalResolution',
  '[Enhancements]MaxAnisotropy',
  '[Settings]MSAA',
  '[Settings]SSAA',
]
known = [
  '[Settings]ShaderCompilationMode',
  '[Settings]wideScreenHack',
  '[Settings]AspectRatio',
]

# Azahar (3DS). Same Qt settings format as Eden. The system configuration (language,
# region, user name, birthday) is not in this file; it is the `sysdata-config` data file.
[settings.azahar]
process = ["azahar", "azahar-qt", "azahar.AppImage"]
[settings.azahar.files.qt-config]
path = "~/.config/azahar-emu/qt-config.ini"
format = "qt-ini"
noise = [
  '[Controls]*',
  '[Camera]*',
  '[Data%20Storage]*',
  '[Debugging]*',
  '[Miscellaneous]*',
  '[VideoDumping]*',
  '[Renderer]physical_device',
  '[Audio]*_device',
  '[UI]UILayout\*',
  '[UI]GameList\*',
  '[UI]Paths\*',
  '[UI]Shortcuts\*',
  '[UI]Multiplayer\*',
  '[UI]firstStart',
  '[UI]calloutFlags',
  '[UI]fullscreen',
  '[UI]show*Bar',
  '[UI]showConsole',
  '[System]init_*',
  '[WebService]web_api_url',
]
secret = [
  '[WebService]*_token',
  '[WebService]*_username',
  '[WebService]network_token',
]
device = [
  '[Renderer]resolution_factor',
  '[Layout]layout_option',
  '[Layout]swap_screen',
  '[Layout]large_screen_proportion',
  '[Layout]small_screen_position',
  '[Layout]custom_*',
  '[Layout]screen_*',
  '[Layout]upright_screen',
  '[Layout]layouts_to_cycle',
  '[UI]resolution_factor',
]
known = [
  '[System]region_value',
  '[Renderer]graphics_api',
  '[Renderer]use_disk_shader_cache',
]
[settings.azahar.data.sysdata-config]
path = "~/Emulation/storage/azahar/nand/data/00000000000000000000000000000000/sysdata/00010017/00000000/config"
create_when = "~/Emulation/storage/azahar/nand"

# melonDS (Flatpak).
# `Instance0.Firmware.Username` is the DS nickname, not a login, so it is common.
[settings.melonds]
process = ["melonDS"]
[settings.melonds.files.config]
path = "~/.var/app/net.kuribo64.melonDS/config/melonDS/melonDS.toml"
format = "toml"
noise = [
  'LastBIOSFolder',
  'LastROMFolder',
  'Instance0.Keyboard.*',
  'Instance0.Joystick.*',
  'Instance0.JoystickID',
  'Instance0.Window*.Geometry',
  'Instance0.*Path',
  'Instance0.Gdb*',
  'Instance0.RTC.*',
  'DS.*Path',
  'DSi.*Path',
  'DSi.Camera*',
  'DSi.SD.*',
  'DLDI.*',
  'Mic.*',
  'RecentROM',
  'Instance0.Window*.Enabled',
]
device = [
  '3D.Renderer',
  '3D.GL.ScaleFactor',
  'Instance0.Window0.Screen*',
  'Instance0.Firmware.MAC',
  'Instance0.Window0.IntegerScaling',
  'Screen.UseGL',
]
known = [
  'Instance0.Firmware.Username',
  'Instance0.Firmware.Language',
  'Instance0.Firmware.BirthdayMonth',
  'Instance0.Firmware.BirthdayDay',
  'Instance0.Firmware.FavouriteColour',
  'Instance0.Firmware.Message',
  'Instance0.Firmware.OverrideSettings',
]

# PPSSPP (Flatpak). The file starts with a UTF-8 BOM, which the ini handler keeps.
[settings.ppsspp]
process = ["PPSSPPSDL", "PPSSPPQt"]
[settings.ppsspp.files.ini]
path = "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SYSTEM/ppsspp.ini"
format = "ini"
noise = [
  '[General]FirstRun',
  '[General]RunCount',
  '[General]CurrentDirectory',
  '[General]*ScrollPosition',
  '[Recent]*',
  '[PlayTime]*',
  '[Debugger]*',
  '[Log]*',
  '[Upgrade]*',
  '[Control]*',
  '[TouchControls.*]*',
  '[GestureControls.*]*',
  '[Graphics]VulkanDevice',
  '[Graphics]FailedGraphicsBackends',
  '[Graphics]DisabledGraphicsBackends',
  '[Graphics]CameraDevice',
  '[Sound]AudioDevice',
  '[SystemParam]MacAddress',
  '[General]Window*',
  '[General]LastRemote*',
  '[General]GridView*',
]
secret = ['[Achievements]AchievementsUserName', '[Network]InfrastructureUsername']
device = [
  '[Graphics]InternalResolution',
  '[Graphics]AnisotropyLevel',
  '[DisplayLayout.*]*',
  '[Graphics]FullScreen',
  '[Graphics]FullScreenMulti',
]
known = [
  '[General]Language',
  '[SystemParam]NickName',
  '[SystemParam]Language',
  '[SystemParam]ButtonPreference',
  '[Graphics]GraphicsBackend',
  '[Achievements]AchievementsEnable',
  '[Achievements]AchievementsChallengeMode',
]

# Vita3K. A flat YAML file; the handler reads only top-level `key: scalar` lines. Its
# user must be user 00, the one the saves sync (`vita3k-saves`): the user's name,
# avatar and settings are the `user-00` data file.
[settings.vita3k]
process = ["Vita3K"]
[settings.vita3k.files.config]
path = "~/.config/Vita3K/config.yml"
format = "yaml-flat"
noise = [
  'keyboard-*',
  'controller-*',
  'pref-path',
  'gpu-idx',
  'custom-driver-name',
  'initial-setup',
  'show-welcome',
  'warn-missing-firmware',
  'check-for-updates-mode',
  'front-camera-*',
  'back-camera-*',
  'adhoc-addr',
  'psn-signed-in',
  'discord-rich-presence',
  'log-*',
  'gdbstub',
  'apps-list-grid',
  'validation-layer',
  'tracy-*',
  'wait-for-debugger',
  'color-surface-debug',
  'lle-modules',
  'user-auto-connect',
]
device = ['resolution-multiplier', 'anisotropic-filtering', 'screen-filter']
known = [
  'sys-lang',
  'sys-button',
  'sys-date-format',
  'sys-time-format',
  'user-id',
  'user-lang',
  'backend-renderer',
]
[settings.vita3k.data.user-00]
path = "~/Emulation/storage/Vita3K/ux0/user/00/user.xml"
create_when = "~/Emulation/storage/Vita3K/ux0/user/00"

# xemu (Flatpak). `input.gamepad_mappings` spans several lines and is not writable.
# The EEPROM holds the Xbox language and video mode (and the console's identity).
[settings.xemu]
process = ["xemu"]
[settings.xemu.files.config]
path = "~/.var/app/app.xemu.xemu/data/xemu/xemu/xemu.toml"
format = "toml"
noise = ['general.last_viewed_menu_index', 'general.show_welcome', 'input.*', 'sys.files.*']
device = ['display.quality.surface_scale']
known = ['sys.mem_limit']
[settings.xemu.data.eeprom]
path = "~/Emulation/storage/xemu/eeprom.bin"
create_when = "~/Emulation/storage/xemu"

# Xenia Canary, the Windows build EmuDeck runs under Proton in portable mode (portable.txt
# next to the exe). Canary reads only xenia-canary.config.toml; the xenia.config.toml and
# xenia-edge.config.toml EmuDeck copies there are never read. The kernel cuts the process
# name to "xenia_canary.ex", which matches. Logging to the profile in slot 0 is a shared key.
# The console language and country are not in the TOML: they live in the binary
# xconfig.settings (Console > Open console settings), which also holds the console's MAC.
[settings.xenia]
process = ["xenia_canary.exe"]
[settings.xenia.files.config]
path = "~/Emulation/roms/xbox360/xenia-canary.config.toml"
format = "toml"
noise = ['UI.window_size_*', 'Logging.*']
device = [
  'Display.fullscreen',
  'GPU.draw_resolution_scale_*',
  'D3D12.d3d12_adapter',
  'Vulkan.vulkan_device',
  'Storage.*_root',
]
known = ['Profiles.logged_profile_slot_0_xuid']
[settings.xenia.data.xconfig]
path = "~/Emulation/roms/xbox360/xconfig.settings"
create_when = "~/Emulation/roms/xbox360"

# Ryujinx. A JSON file; hotkeys and window state are noise, and a key with an array
# value is not writable.
[settings.ryujinx]
process = ["Ryujinx"]
[settings.ryujinx.files.config]
path = "~/.config/Ryujinx/Config.json"
format = "json"
noise = [
  'version',
  'window_startup.*',
  'gui_columns.*',
  'column_sort.*',
  'shown_file_types.*',
  'hotkeys.*',
  'preferred_gpu',
  'system_time_offset',
  'logging_*',
  'enable_file_log',
  'graphics_shaders_dump_path',
  'multiplayer_lan_interface_id',
  'grid_size',
  'application_sort',
  'is_ascending_order',
  'game_list_view_mode',
  'show_names',
  'enable_gdb_stub',
  'gdb_stub_port',
  'debugger_suspend_on_start',
  'game_dirs',
  'autoload_dirs',
  'input_config',
  'player_input_assignments',
  'ldn_server',
  'remember_window_state',
  'show_title_bar',
  'start_fullscreen',
  'start_no_ui',
  'show_console',
]
secret = ['multiplayer_ldn_passphrase']
device = [
  'docked_mode',
  'res_scale',
  'res_scale_custom',
  'max_anisotropy',
  'scaling_filter',
  'scaling_filter_level',
  'anti_aliasing',
]
known = [
  'system_language',
  'system_region',
  'system_time_zone',
  'language_code',
  'graphics_backend',
  'enable_vsync',
]

# ES-DE itself: its `es_settings.xml` (a flat list of `<bool|int|float|string name= value=>`
# elements; canonical key = the `name`, value typed by the tag). Only the scraper's media
# toggles, region and language are `known`. ES-DE rewrites the file when it quits, so it is
# skipped while it runs, which includes the startup script's own `settings apply`: its keys are
# applied by the `warpzone-settings` timer while ES-DE is closed (see
# development/design/emulator-settings.md, "ES-DE settings"). The `esde-xml` handler never
# writes `CustomEventScripts` (provision owns it) or a key ending in `Directory`, `Dir`, `Path`
# or `Paths`, whatever a layer says. The process names are those of `esde.ESDE_PROCESSES`.
[settings.esde]
process = ["es-de", "ES-DE.AppImage"]
[settings.esde.files.es-settings]
path = "~/ES-DE/settings/es_settings.xml"
format = "esde-xml"
noise = [
  '*Directory',
  '*Dir',
  '*Path',
  '*Paths',
  'CustomEventScripts',
  'Screen*',
  'Window*',
  'DisplayIndex',
  'AudioDevice*',
  'Input*',
]
secret = ['Scraper*Username*', 'Scraper*Password*']
known = [
  'ScrapeVideos',
  'ScrapeCovers',
  'ScrapeScreenshots',
  'ScrapeTitleScreens',
  'Scrape3DBoxes',
  'ScrapePhysicalMedia',
  'ScrapeMarquees',
  'ScrapeBackCovers',
  'ScrapeFanArt',
  'ScrapeManuals',
  'ScraperRegion',
  'ScraperLanguage',
]
