  '[TouchControls.*]*',
  '[GestureControls.*]*',
  '[Graphics]VulkanDevice',
  '[Graphics]FailedGraphicsBackends',
  '[Graphics]DisabledGraphicsBackends',
  '[Graphics]CameraDevice',
  '[Sound]AudioDevice',
  '[SystemParam]MacAddress',
  '[General]Window*',
  '[General]LastRemote*',
  '[General]GridView*',
]
secret = ['[Achievements]AchievementsUserName', '[Network]InfrastructureUsername']
device = [
  '[Graphics]InternalResolution',
  '[Graphics]AnisotropyLevel',
  '[DisplayLayout.*]*',
  '[Graphics]FullScreen',
  '[Graphics]FullScreenMulti',
]
known = [
  '[General]Language',
  '[SystemParam]NickName',
  '[SystemParam]Language',
  '[SystemParam]ButtonPreference',
  '[Graphics]GraphicsBackend',
  '[Achievements]AchievementsEnable',
  '[Achievements]AchievementsChallengeMode',
]

# Vita3K. A flat YAML file; the handler reads only top-level `key: scalar` lines. Its
# user must be user 00, the one the saves sync (`vita3k-saves`): the user's name,
# avatar and settings are the `user-00` data file.
[settings.vita3k]
process = ["Vita3K"]
[settings.vita3k.files.config]
path = "~/.config/Vita3K/config.yml"
format = "yaml-flat"
noise = [
  'keyboard-*',
  'controller-*',
  'pref-path',
  'gpu-idx',
  'custom-driver-name',
  'initial-setup',
  'show-welcome',
  'warn-missing-firmware',
  'check-for-updates-mode',
  'front-camera-*',
  'back-camera-*',
  'adhoc-addr',
  'psn-signed-in',
  'discord-rich-presence',
  'log-*',
  'gdbstub',
  'apps-list-grid',
  'validation-layer',
  'tracy-*',
  'wait-for-debugger',
  'color-surface-debug',
  'lle-modules',
  'user-auto-connect',
]
device = ['resolution-multiplier', 'anisotropic-filtering', 'screen-filter']
known = [
  'sys-lang',
  'sys-button',
  'sys-date-format',
  'sys-time-format',
  'user-id',
  'user-lang',
  'backend-renderer',
]
[settings.vita3k.data.user-00]
path = "~/Emulation/storage/Vita3K/ux0/user/00/user.xml"
create_when = "~/Emulation/storage/Vita3K/ux0/user/00"

# xemu (Flatpak). `input.gamepad_mappings` spans several lines and is not writable.
# The EEPROM holds the Xbox language and video mode (and the console's identity).
[settings.xemu]
process = ["xemu"]
[settings.xemu.files.config]
path = "~/.var/app/app.xemu.xemu/data/xemu/xemu/xemu.toml"
format = "toml"
noise = ['general.last_viewed_menu_index', 'general.show_welcome', 'input.*', 'sys.files.*']
device = ['display.quality.surface_scale']
known = ['sys.mem_limit']
[settings.xemu.data.eeprom]
path = "~/Emulation/storage/xemu/eeprom.bin"
create_when = "~/Emulation/storage/xemu"

# Ryujinx. A JSON file; hotkeys and window state are noise, and a key with an array
# value is not writable.
[settings.ryujinx]
process = ["Ryujinx"]
[settings.ryujinx.files.config]
path = "~/.config/Ryujinx/Config.json"
format = "json"
noise = [
  'version',
  'window_startup.*',
  'gui_columns.*',
  'column_sort.*',
  'shown_file_types.*',
  'hotkeys.*',
  'preferred_gpu',
  'system_time_offset',
  'logging_*',
  'enable_file_log',
  'graphics_shaders_dump_path',
  'multiplayer_lan_interface_id',
  'grid_size',
  'application_sort',
  'is_ascending_order',
  'game_list_view_mode',
  'show_names',
  'enable_gdb_stub',
  'gdb_stub_port',
  'debugger_suspend_on_start',
  'game_dirs',
  'autoload_dirs',
  'input_config',
  'player_input_assignments',
  'ldn_server',
  'remember_window_state',
  'show_title_bar',
  'start_fullscreen',
  'start_no_ui',
  'show_console',
]
secret = ['multiplayer_ldn_passphrase']
device = [
  'docked_mode',
  'res_scale',
  'res_scale_custom',
  'max_anisotropy',
  'scaling_filter',
  'scaling_filter_level',
  'anti_aliasing',
]
known = [
  'system_language',
  'system_region',
  'system_time_zone',
  'language_code',
  'graphics_backend',
  'enable_vsync',
]
