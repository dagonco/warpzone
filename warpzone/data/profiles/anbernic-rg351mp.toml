name = "anbernic-rg351mp"
description = "Anbernic RG351MP running dArkOS (EmulationStation and RetroArch, ROMs on an exFAT card)"

# /roms is exFAT: no POSIX permissions and no symlinks. Every folder of the device ignores
# permissions (the hub's would otherwise show up as local changes on every file), and
# nothing below depends on a symlink.
ignore_perms = true

# The library has a place on this device, and so has the scraped artwork (`[artwork]`
# below). There is no ES-DE, no songs folder, no tools folder and no emulator settings
# layer, so a device of this profile that lists `tools`, `songs` or `settings` in its folders
# is refused with a clear error; `frontend` is the artwork.
#
# The library goes in its own folder next to dArkOS's own: games land in
# /roms/library/roms/<system> and BIOS files in /roms/library/bios.
[paths]
library = "/roms/library"
# A device that lists `play-state` shares favourites and play statistics here, on the card.
# This frontend needs no `[play_state]` table: the `[artwork]` timer below does the work.
play_state = "/roms/warpzone/play-state"

# EmulationStation reads ~/.emulationstation/es_systems.cfg before the system list in /etc, so
# `provision device` writes a copy of that list with every ROM folder moved into the library.
# The copy is made only while EmulationStation is not running. Systems the hub has no
# games for point into the library too and stay empty (and hidden by EmulationStation);
# dArkOS's own /roms/<system> folders are not listed any more. `prefix` is the folder the
# system list uses; entries outside it (`/opt/cmds/`) are not touched.
# EmulationStation's process name is cut to 15 characters by the kernel.
[es_systems]
source = "/etc/emulationstation/es_systems.cfg"
override = "~/.emulationstation/es_systems.cfg"
prefix = "/roms/"
process = ["emulationstatio", "emulationstation"]
# Systems dArkOS and the hub name differently: list folder = hub folder.
[es_systems.rename]
pokemonmini = "pokemini"
segacd = "megacd"
pico-8 = "pico8"
coleco = "colecovision"
atarixegs = "atarixe"

# dArkOS has two RetroArch builds (64-bit and 32-bit), each with its own config. Both
# take BIOS files from the library and keep saves and save states in the two folders
# below (the `[saves.*]` entries) instead of next to the ROMs, so they can sync.
# RetroArch is not running while the files are edited.
[retroarch]
cfg = ["~/.config/retroarch/retroarch.cfg", "~/.config/retroarch32/retroarch.cfg"]
process = ["retroarch", "retroarch32"]
[retroarch.set]
system_directory = "{library}/bios"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"

# Same hub folders as the Steam Deck and Steam Machine (`saves/retroarch/saves` and
# `saves/retroarch/states`). Both are real directories on the card's root filesystem. They
# are created once ~/.config/retroarch exists.
[saves.retroarch-saves]
path = "~/.config/retroarch/saves"
create_when = "~/.config/retroarch"
[saves.retroarch-states]
path = "~/.config/retroarch/states"
create_when = "~/.config/retroarch"

# EmulationStation here shows no artwork or descriptions of its own: it reads
# <rom folder>/gamelist.xml, where it also saves what the player does. The hub's ES-DE
# data (scraped gamelists and media, the `frontend` folders) arrives receive-only, limited to
# the `kinds` below and to the systems that have a folder in the library's `roms/`, so it
# follows the whitelist without being edited. The folders are outside the library, on the
# card (exFAT). The `emulationstation` converter turns each ES-DE gamelist into one for this
# frontend (absolute `<image>` paths to the covers that exist, only games that are on the
# device, user data such as favourites kept) under the name the system list gives the system
# (`[es_systems.rename]` maps the folder names). It runs at `provision device` and with
# `warpzone frontend refresh`, only while EmulationStation is closed; `refresh` installs a
# `systemd --user` timer that runs it that often.
[artwork]
format = "emulationstation"
kinds = ["covers"]
systems = "library"
media = "/roms/warpzone/media"
metadata = "/roms/warpzone/es-de"
gamelists = "{rompath}"
refresh = "15min"

# Paths in the library folder that the device never receives from the hub. EmulationStation
# writes a gamelist.xml next to the ROMs of a system when it saves its metadata; it is
# per-device data and not on the hub, so a receive-only folder would list it as a local
# change. `(?d)` lets Syncthing remove a ROM folder that the hub deleted anyway.
[library]
ignore = ["(?d)/roms/*/gamelist.xml"]

# ArkOS lists every executable .sh in /opt/system in its Options menu. `provision device`
# adds "Warpzone Status.sh" (version, updater state and the problems `warpzone doctor`
# finds, read from local files) and "Warpzone Update Now.sh" there, and touches nothing
# else in the folder.
[options_menu]
dir = "/opt/system"

# EmulationStation is open whenever the console is on, so a timer that waits for the menu to
# close would wait for days, and one that does not would update in the middle of a session.
# The timer only looks for a release; "Warpzone Update Now" in Options installs it.
[updater]
install = "manual"
