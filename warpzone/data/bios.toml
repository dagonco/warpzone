# BIOS manifest for `warpzone bios`: file names, sizes and hashes only.
#
# warpzone never downloads BIOS files and this repository holds none of their
# content. Everything below is public metadata used to tell a user what to obtain
# and whether what they have is the expected dump.
#
# Sources (checked October 2026):
#   * File entries: libretro-database `dat/System.dat` v1.19.0
#     (https://github.com/libretro/libretro-database/blob/master/dat/System.dat),
#     the `rom ( name ... size ... md5 ... )` lines of each console's section.
#     Kept as is, except: PS2 names lose the `pcsx2/bios/` prefix, and nds
#     `firmware.bin` is size-only because every console has its own firmware.
#   * Zip sets (`zip` items): member names and CRC32 from MAME 0.282's own source,
#     tag `mame0282` of https://github.com/mamedev/mame (the BIOS macros and
#     ROM_START blocks of src/mame/neogeo/neogeo.cpp, src/mame/sega/naomi.cpp,
#     src/mame/sega/dc_atomiswave.cpp, src/mame/konami/nemesis.cpp (bubsys),
#     src/devices/sound/ymopl.cpp (ym2413) and src/devices/sound/qsoundhle.cpp).
#     A zip passes when every listed member is present with the listed CRC32;
#     extra members are ignored.
#
# To regenerate: re-read those sections and macros, copy the md5/size (or the
# member CRCs) here, and keep the curation below (which items are required, the
# "any of" groupings, the notes). The curation is by hand on purpose.
#
# Format:
#   [<system>]              title = "..."
#                           games = ["folder", ...]  ROM folders (under roms/) that hold this
#                           system's games; a system whose folders hold no games is not judged
#   [[<system>.item]]       one thing to have; it is satisfied when ANY of its files is ok
#     name       label shown in the report, unique within the system
#     base       "bios" (default) or "roms": the folder `path` is relative to
#     required   default true; a required item that is missing or wrong makes the exit code 1
#     any_name   default false; if the file is absent, accept any file of the same
#                folder and size whose md5 is accepted (emulators that identify a BIOS by content)
#     note       what it unlocks
#     files      [{ path, size, md5 }]; no md5 means the size alone is checked
#     zip        instead of files: a zip under base, with a [<system>.item.members] table
#                of member name = crc32
#   skip_dirs  folders of bios/ that are never opened or listed (console keys and firmware)
skip_dirs = ["eden", "azahar"]

