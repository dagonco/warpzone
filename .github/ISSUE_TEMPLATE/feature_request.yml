name: Feature request
description: A command, option, console, emulator or system warpzone does not support yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the setup, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. For a new console or emulator, say where it keeps games, saves and BIOS files if you know.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
