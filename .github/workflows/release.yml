name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Two tags pushed close together queue instead of racing; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the tag, the package version and main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import warpzone; print(warpzone.__version__)')"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not match package version v${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
          python scripts/changelog_section.py "$version" > /dev/null
          prerelease=true
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check
      - run: python -m unittest discover -s tests -v

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Provenance needs the OIDC token and attestation writes; it never needs contents: write.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install "build==1.6.1"
          python -m build --outdir dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          python scripts/changelog_section.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
