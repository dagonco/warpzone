name: ci

# Pull requests are tested in full, and main only takes a pull request that is up to date
# with it (squash merge), so a push to main would test the same tree again. A weekly run
# catches what changes outside the code (runner images, Python releases).
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Syncthing release used by the e2e job. The hash comes from the release's
  # sha256sum.txt.asc; update both together when bumping the version.
  SYNCTHING_VERSION: v2.1.7
  SYNCTHING_LINUX_AMD64_SHA256: 2edc416e7ed136b7c858ed5f3f02a3b8316589605e54c380228ceea7acbf0142

jobs:
  # Which jobs a pull request needs, from the files it changes. A job whose files did not
  # change is skipped (a skipped job counts as passed for the required checks). Matrix jobs
  # skip their steps instead of the whole job, because a skipped matrix job reports one check
  # without the matrix name and the required checks would wait for ever. The weekly and
  # manual runs run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      updater: ${{ steps.diff.outputs.updater }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python=false
          updater=false
          if [ "$EVENT" != pull_request ]; then
            python=true
            updater=true
          else
            for f in $(git diff --name-only "$BASE...$HEAD"); do
              case $f in
              # Documentation the tests do not read (they read the design pages, the
              # changelog and examples/).
              website/src/content/docs/development/*) python=true ;;
              website/* | .claude/* | LICENSE | README.md | CONTRIBUTING.md | AGENTS.md) ;;
              .github/dependabot.yml | .github/workflows/docs.yml) ;;
              *) python=true ;;
              esac
              # What tests/test_updater_sh.py depends on. updater.sh is the script under test
              # and allowed_signers is the key file it verifies tags against. procs.py and
              # versions.py are the modules the test imports (they import no other warpzone
              # module), and __init__.py runs on those imports. tests/support.py is imported
              # for FakeProc, and pyproject.toml is read by the package-data checks. The
              # modules support.py itself imports are not listed: a break there is caught by
              # the `test` jobs, which run for any change to the package.
              case $f in
              warpzone/data/updater.sh | warpzone/data/allowed_signers) updater=true ;;
              warpzone/procs.py | warpzone/versions.py | warpzone/__init__.py) updater=true ;;
              tests/test_updater_sh.py | tests/support.py | pyproject.toml) updater=true ;;
              .github/workflows/ci.yml) python=true; updater=true ;;
              esac
            done
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "python=$python updater=$updater"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check

  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Configuration is in pyproject.toml ([tool.mypy]); only the package is checked.
      - run: python -m pip install mypy==2.4.1
      - run: python -m mypy

  test:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux is where devices run: the oldest supported Python and the newest. macOS is
        # where the inbox and the hub commands run: one Python is enough there.
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: ${{ matrix.python }}
      # The updater script's tests (tests/test_updater_sh.py) take minutes on their own and
      # run in the `updater` job; WARPZONE_SKIP_UPDATER_SH makes them skip here.
      - name: Run the tests
        if: needs.changes.outputs.python == 'true'
        timeout-minutes: 6
        env:
          WARPZONE_SKIP_UPDATER_SH: "1"
        run: python -X faulthandler -m unittest discover -s tests -v

  # tests/test_updater_sh.py runs warpzone/data/updater.sh against real git repositories and
  # takes a couple of minutes (more on macOS), so it has a job of its own, in parallel.
  # Ubuntu runs it with dash as sh (what the devices have) and shellcheck, macOS with the
  # system sh (bash in POSIX mode), on one Python version.
  updater:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: macos-latest
            shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.updater == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.updater == 'true'
        with:
          python-version: "3.13"
      - name: Install shellcheck
        if: needs.changes.outputs.updater == 'true'
        timeout-minutes: 5
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - name: Run the updater script tests
        if: needs.changes.outputs.updater == 'true'
        timeout-minutes: 10
        env:
          WZ_TEST_SHELL: ${{ matrix.shell }}
        run: |
          shellcheck --version
          python -X faulthandler -m unittest discover -s tests -p test_updater_sh.py -v

  e2e:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download pinned Syncthing
        run: |
          set -euo pipefail
          archive="syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/${archive}"
          echo "${SYNCTHING_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "WARPZONE_E2E_SYNCTHING=$RUNNER_TEMP/syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -k EndToEnd -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # The two jobs below run only on the weekly and manual runs, never on a pull request: the
  # image takes minutes to build and the coverage number is information, not a gate.

  # Builds the hub's container image and runs it far enough to see that it works, so that a
  # base image or apt change that breaks it shows up here and not on the first rebuild on the
  # hub. Nothing is pushed and no registry login is made. The RAHasher stage compiles C++,
  # hence the generous timeout.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        timeout-minutes: 35
        run: docker build -f docker/Dockerfile -t warpzone:ci .
      # The entrypoint is `warpzone` and the user is 65534, so the version check passes only
      # its argument; the tools are looked up with the entrypoint replaced by `sh`.
      - name: Check the version and the tools
        run: |
          set -euo pipefail
          expected="$(python3 -m warpzone --version)"
          actual="$(docker run --rm warpzone:ci --version)"
          echo "checkout: $expected"
          echo "image:    $actual"
          test "$actual" = "$expected"
          docker run --rm --entrypoint sh warpzone:ci -c '
            set -eu
            # One name at a time: dash, the sh of the image, looks up only the first argument.
            command -v chdman
            command -v bsdtar
            command -v RAHasher
            bsdtar --version
            test "$(id -u)" != 0
          '

  # Unit tests under coverage with branch measurement, limited to the warpzone package, on the
  # Python the typecheck job uses. The number goes to the job summary; there is no threshold.
  # The updater script's tests are skipped as in the `test` job: they measure a shell script.
  # Subprocesses the tests start are not measured.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # A CI-only tool, pinned like mypy; the package keeps no dependency.
      - run: python -m pip install coverage==7.17.2
      - name: Run the tests under coverage
        timeout-minutes: 10
        env:
          WARPZONE_SKIP_UPDATER_SH: "1"
        run: python -X faulthandler -m coverage run --branch --source=warpzone -m unittest discover -s tests
      - name: Write the summary
        run: |
          {
            echo "### Coverage of the warpzone package (branches included)"
            echo
            echo "Total: $(python -m coverage report --precision=1 --format=total) %"
            echo
            echo "The ten least covered modules:"
            echo
            python -m coverage report --precision=1 --format=markdown --sort=cover | head -n 12
          } >> "$GITHUB_STEP_SUMMARY"
