# warpzone on the hub: the library UI (`warpzone serve`) in one small container.
# Copy this file next to the folders it names, change the values marked CHANGE, and see
# https://dagonco.github.io/warpzone/setup/hub-container/ for the steps. All values are fake.
#
# Build the image first, from a checkout of warpzone:
#   docker build -f docker/Dockerfile -t warpzone:local .
#
# Put next to this file:
#   config/config.toml   the config from examples/config.example.toml, with in the tables:
#                          [hub]    root = "/srv/games"        (your games share; the same as the mount below)
#                                   api_url = "https://192.168.1.10:8384"   (see "Network" below)
#                                   api_cert_sha256 = "AB:CD:..."   (Syncthing's GUI certificate, see "Network")
#                                   api_key_file = "/config/hub.key"
#                          [inbox]  rahasher = "/usr/local/bin/RAHasher"   (optional, RA hashes)
#                          [serve]  token_file = "/config/ui.token"
#   config/hub.key       the hub Syncthing's API key
#   config/ui.token      one line: the token the UI asks for (a long random string)
#   warpzone.env         create it even if you have no key (compose refuses a missing file); one line,
#                        RA_API_KEY=<your RetroAchievements web API key>
# The files in config/ must be readable by the uid below (chmod 640 with the share's group, or 644
# if nobody else uses the NAS).
#
# The second service, `warpzone-inbox`, at the end of the file, runs `warpzone inbox` with the tools
# in the image. It also needs dats/ (the DATs), keys/ (your Switch keys and PS Vita zRIF file),
# work/ (room for conversions) and skyscraper/ (Skyscraper's config.ini and cache) next to this
# file; the keys and the big data are read from them and are never part of the image.

name: warpzone

services:
  warpzone:
    image: warpzone:local
    container_name: warpzone
    restart: unless-stopped

    # CHANGE: the uid and gid that own the games share (`id -u` and `id -g` of that user on the
    # NAS). The container writes library/patterns-*.stignore and catalog/ as this user.
    user: "1000:1000"

    # Synology: the share often grants access through ACL entries to the `administrators` group
    # (gid 101 on Synology) and not to the owner's uid, so a process with only its primary group
    # cannot open the files although `ls -l` shows rwxrwxrwx ("Permission denied" reading
    # library/patterns-*.stignore). Uncomment to add that group; check the gid with
    # `getent group administrators` on the NAS.
    # group_add:
    #   - "101"

    # Light and locked down: one process, a small memory limit, nothing writable but the share and
    # /tmp. If `catalog --ra-hash` is killed (exit 137), raise the limit and run it again.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

    # The UI and its API. Change the left number to publish another port; the right one is fixed
    # by the image's health check.
    ports:
      - "8780:8780"

    volumes:
      # The hub root, at the same path as `[hub] root` in the config, so one config is right
      # inside and outside the container. Read-write: the UI writes the whitelists and catalog/.
      # CHANGE: /srv/games is an example; use your own games share on both sides (on a Synology NAS
      # the share is usually under /volume1/).
      - /srv/games:/srv/games
      # config.toml, hub.key and ui.token. Read-only.
      - ./config:/config:ro

    # Without RA_API_KEY in this file the RetroAchievements game lists are not downloaded.
    env_file:
      - ./warpzone.env

    # Network. With the default (bridge) network the container reaches the hub's Syncthing at
    # `[hub] api_url`, which must be a LAN address of the NAS, not 127.0.0.1 (and Syncthing's GUI
    # must listen on it). Use `https://` there with `[hub] api_cert_sha256` (read it on the NAS with
    # `openssl x509 -in https-cert.pem -noout -fingerprint -sha256`; the file is in Syncthing's
    # config folder), so the API key does not cross the network in the clear. If Syncthing's GUI listens only on 127.0.0.1, the container has to share
    # the host's network instead: remove `ports:` above, uncomment the next line, and set
    # `api_url = "http://127.0.0.1:8384"`. The UI is then on port 8780 of the NAS.
    # network_mode: host

  # `warpzone inbox` in the same image: it files the games dropped in <hub root>/inbox/ with the
  # tools the image ships (chdman, bsdtar, RAHasher, dolphin-tool, nsz, orbis-pkg-util, and
  # Skyscraper, which scrapes what it places), so nothing has to be installed on the NAS. A profile
  # keeps `docker compose up -d` from starting it; run it with
  # `docker compose run --rm warpzone-inbox inbox` (a report) and `... inbox --apply`.
  # The same service runs the nightly scrape (`scrape --unattended`, a second scheduled task; see
  # https://dagonco.github.io/warpzone/setup/scrape/#filling-art-every-night), so there is no
  # service to add.
  # It repeats the mounts and limits above and adds folders the image does not hold: three of keys
  # and big data, which come from the NAS read-only and never go into the image, and Skyscraper's.
  warpzone-inbox:
    image: warpzone:local
    # No `container_name`: `docker compose run` would use it, and a second run while one is
    # working (a long unattended tick, a run by hand) would fail with "name already in use"
    # instead of reaching the lock and exiting as busy.
    profiles: ["inbox"]
    user: "1000:1000"                    # CHANGE: the same uid and gid as above
    # group_add:
    #   - "101"                          # if the warpzone service needs it
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g                        # more than the server: conversions and archives
    # Leave the NAS's other cores to SMB and Syncthing, especially for the scheduled
    # `inbox --apply --unattended`. chdman counts the host's cores, not this limit: put the same
    # number in `[inbox] chdman_threads` of the config. Some Synology kernels have no CFS quota
    # and refuse `cpus` ("NanoCPUs can not be set"); there, replace the line with
    # `cpu_shares: 512` (a relative weight: SMB and Syncthing win when the CPU is busy, no hard
    # cap), and on a 2-core NAS use `chdman_threads = 1`. Also put `chdman_flac = false` in
    # `[inbox]`: chdman's FLAC codecs need more memory than the disc image (a 1.9 GB DVD
    # image was killed at this `mem_limit`; a CD conversion took 1.96 GB, against 37 MB without),
    # which is why `warpzone doctor` warns when it is left on here.
    cpus: "2"
    volumes:
      - /srv/games:/srv/games            # CHANGE: the hub root, read-write, the same path as [hub] root
      - ./config:/config:ro
      # libretro-database's metadat/redump and metadat/no-intro, and, if you use them, titledb
      # (Switch names) and the arcade DATs. warpzone never downloads them.
      - ./dats:/dats:ro
      # Your Switch keys file (prod.keys, which nsz reads) and your PS Vita zRIF file.
      # Keep this folder out of the share and out of Syncthing; only inbox reads it.
      - ./keys:/keys:ro
      # Unpacked archives and conversions: room for a few GiB. The container's /tmp is memory.
      - ./work:/work
      # Skyscraper's home folder (its `~/.skyscraper`): config.ini and the cache, read-write and
      # owned by the uid above. Create skyscraper/config.ini by hand if you want a ScreenScraper
      # account (the same keys as in https://dagonco.github.io/warpzone/setup/scrape/, such as
      # userCreds under [screenscraper]); it holds that password, so chmod 600 it. warpzone never
      # reads, prints or passes it. The cache grows by about 2.6 MB per game scraped and is what
      # lets a run stopped by ScreenScraper's daily limit go on the next day: keep it on disk,
      # never in the tmpfs. Without this mount Skyscraper cannot run and `inbox` does not scrape.
      - ./skyscraper:/skyscraper
    env_file:
      - ./warpzone.env
    environment:
      XDG_CACHE_HOME: /work/cache        # the parsed DATs are cached here
    # In config/config.toml, next to the keys the warpzone service reads:
    #   [inbox]
    #   root = "/srv/games"                                  # the hub root as mounted above
    #   dats_dir = "/dats/libretro-database/metadat"
    #   work_dir = "/work/tmp"
    #   rahasher = "/usr/local/bin/RAHasher"                 # optional
    #   titledb_dir = "/dats/titledb"                        # optional: Switch names
    #   switch_keys = "/keys/prod.keys"                      # Switch .nsp / .nsz
    #   vita_zrif = "/keys/PSV_GAMES.tsv"                    # PS Vita .pkg (needs Vita3K, see the docs)
    #   mame_dat = "/dats/mame0282lx.zip"                    # optional: arcade
    #   fbneo_dat = "/dats/fbneo-arcade.dat"
    #   mame2003plus_dat = "/dats/mame2003-plus.xml"
    # dolphin-tool, nsz, orbis-pkg-util and Skyscraper are on PATH in the image, so they need no
    # setting.
